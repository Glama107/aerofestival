name: Deploy Symfony app to VPS

on:
  push:
    branches:
      - main

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build

  deploy:
    needs: build-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: build-output

      - name: Pull latest code and install PHP dependencies
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "SSH connection successful!"
            cd /var/www/aerofestival/
            echo "Pulling latest changes from Git..."
            git reset --hard HEAD
            git pull origin main --rebase
            sudo chown -R deploy:www-data /var/www/aerofestival/*
            echo "Installing dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative --no-dev

      - name: Upload built assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "build-output/*"
          target: "/var/www/aerofestival/public/build"
          strip_components: 1

      - name: Run migrations, warm cache, fix permissions
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/aerofestival/
            echo "Running database migrations..."
            php bin/console cache:clear --no-warmup
            php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            php bin/console cache:warmup
            echo "Installing assets..."
            php bin/console assets:install
            php bin/console cache:clear
            echo "Setting permissions..."
            sudo chown -R deploy:www-data /var/www/aerofestival/*
            sudo chown -R www-data:www-data /var/www/aerofestival/var
            sudo chmod -R 777 /var/www/aerofestival/public/uploads
            echo "Reloading Nginx..."
            sudo systemctl reload nginx
